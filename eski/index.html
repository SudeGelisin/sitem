<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hi there.</title>

  <!-- GSAP 3 ve ScrollTrigger (jsDelivr CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Kapağı sayfanın en üstüne tam genişlikte yerleştir */
    .cover-header {
      width: 100vw;
      min-height: 100vh;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Her bölüm tam ekran yüksekliğinde (100vh) */
    .section {
      width: 100vw;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 3rem 2rem;
      text-align: center;
    }

    /* Maskot ve başlık yerleşimi */
    .heading-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .mascot-img {
      width: clamp(65px, 8vw, 110px);
      height: clamp(65px, 8vw, 110px);
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      flex-shrink: 0;
    }

    /* Çok büyük başlıklar ve az yazı */
    h1, .title {
      font-size: clamp(3.5rem, 10vw, 8.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-transform: none;
    }

    .section-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      margin-bottom: 2.5rem;
      letter-spacing: -0.03em;
    }

    /* Üç kartlık İlgi Alanlarım Bölümü */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2.5rem;
      max-width: 1200px;
      width: 90%;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
    }

    .card-image-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 16px;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img {
      transform: scale(1.05);
    }

    .card-title {
      margin-top: 1.25rem;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    /* Sayfanın altındaki not */
    .footer-note {
      width: 100%;
      padding: 2.5rem 1rem;
      text-align: center;
      background-color: #000000;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .footer-note p {
      font-size: 0.85rem;
      color: #777777;
      letter-spacing: 0.02em;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .section {
        height: auto;
        min-height: 100vh;
        padding: 5rem 1.5rem;
      }
      .cards-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    /* Kullanıcı prefers-reduced-motion: reduce seçtiyse hiçbir şey hareket etmesin */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      h1, .title, .section-title, .cover-image, .mascot-img, .card, .card-img {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Kapağı sayfanın en üstüne tam genişlikte yerleştir -->
  <header class="cover-header">
    <img src="kapak (169).jpg"
         alt="Uzay giysisi giymiş kızıl tilki astronotun uzaydaki bir gezegen yüzeyinde duruşu"
         class="cover-image"
         onerror="this.onerror=null; this.src='OneDrive/Masaüstü/WEB ANİMASYON/kapak (169).jpg';">
  </header>

  <!-- Maskotu başlığın yanına küçük olarak koy -->
  <section class="section hero-section">
    <div class="heading-wrapper">
      <img src="maskot (kare).jpg"
           alt="Kayalıklar üzerinde çift saplı elektro gitar çalan havalı kızıl tilki maskotu"
           class="mascot-img"
           onerror="this.onerror=null; this.src='OneDrive/Masaüstü/WEB ANİMASYON/maskot (kare).jpg';">
      <h1 class="title">hi there.</h1>
    </div>
  </section>

  <!-- Üç kartlık 'İlgi alanlarım' bölümü -->
  <section class="section interests-section" id="ilgi-alanlarim">
    <h2 class="section-title">İlgi alanlarım</h2>
    <div class="cards-grid">
      <div class="card">
        <div class="card-image-box">
          <img src="kart 1 (kare).jpg"
               alt="Dev elektro gitar köprüsü, dev hoparlörler ve voleybol fileli manzaraya bakan sırt çantalı tilki"
               class="card-img"
               onerror="this.onerror=null; this.src='OneDrive/Masaüstü/WEB ANİMASYON/kart 1 (kare).jpg';">
        </div>
        <h3 class="card-title">Müzik & Keşif</h3>
      </div>

      <div class="card">
        <div class="card-image-box">
          <img src="kart 2 (kare).jpg"
               alt="Turkuaz eşofmanlı tilkinin gezegenler altında havaya sıçrayarak voleybol oynaması"
               class="card-img"
               onerror="this.onerror=null; this.src='OneDrive/Masaüstü/WEB ANİMASYON/kart 2 (kare).jpg';">
        </div>
        <h3 class="card-title">Voleybol & Spor</h3>
      </div>

      <div class="card">
        <div class="card-image-box">
          <img src="kart 3 (kare).jpg"
               alt="Uzay giysisi içindeki astronot tilkinin dev köfteli makarna tabağına hayranlıkla bakması"
               class="card-img"
               onerror="this.onerror=null; this.src='OneDrive/Masaüstü/WEB ANİMASYON/kart 3 (kare).jpg';">
        </div>
        <h3 class="card-title">Gastronomi & Uzay</h3>
      </div>
    </div>
  </section>

  <!-- Sayfanın en altındaki küçük not -->
  <footer class="footer-note">
    <p>Bu sitedeki görseller yapay zekâ ile üretildi.</p>
  </footer>

  <script>
    // Kullanıcının prefers-reduced-motion tercihini kontrol et
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!prefersReducedMotion && typeof gsap !== 'undefined') {
      gsap.registerPlugin(ScrollTrigger);

      // Kapak görseli yumuşak belirme
      gsap.from('.cover-image', {
        opacity: 0,
        scale: 1.08,
        duration: 1.6,
        ease: 'power3.out'
      });

      // Başlık ve maskot animasyonu
      gsap.from('.heading-wrapper', {
        opacity: 0,
        y: 60,
        duration: 1.3,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: '.hero-section',
          start: 'top 75%',
          toggleActions: 'play none none reverse'
        }
      });

      // İlgi alanlarım başlık animasyonu
      gsap.from('.section-title', {
        opacity: 0,
        y: 40,
        duration: 1.2,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: '.interests-section',
          start: 'top 75%',
          toggleActions: 'play none none reverse'
        }
      });

      // Kartların sırayla yumuşakça belirmesi (stagger)
      gsap.from('.card', {
        opacity: 0,
        y: 60,
        duration: 1.2,
        stagger: 0.25,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: '.cards-grid',
          start: 'top 80%',
          toggleActions: 'play none none reverse'
        }
      });

      // Oynayan video varsa çalışmaya devam etsin
      document.querySelectorAll('video').forEach((video) => {
        ScrollTrigger.create({
          trigger: video,
          start: 'top center',
          end: 'bottom center',
          onEnter: () => video.play(),
          onLeave: () => video.pause(),
          onEnterBack: () => video.play(),
          onLeaveBack: () => video.pause()
        });
      });
    }
  </script>
</body>
</html>
